# XcodeGen spec for PopUp.xcodeproj. After changing this file, run `xcodegen`
# in this folder to regenerate the project.
name: PopUp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.1"
packages:
  PopUpCore:
    path: PopUpCore
targets:
  PopUp:
    type: application
    platform: iOS
    sources:
      - path: PopUp
    dependencies:
      - package: PopUpCore
    settings:
      base:
        PRODUCT_NAME: PopUp
        PRODUCT_BUNDLE_IDENTIFIER: com.example.popup
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: POP-UP
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme: {}
